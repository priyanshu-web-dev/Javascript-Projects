<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; margin-top: 200px; background-color: black; color: white; border: 2px solid white;">
    
    <form id="parent" style="margin: 10px;padding: 10px;border: 2px solid black ;width: 200px; font-weight: 800; ">
        <h1 class="first">Astrotalk App</h1><br><br>
        <label for="Name">name : </label>
        <input type="text" id="Name"  class="first" placeholder="enter your name"><br>

        <label for="Surname">Surname : </label>
        <input type="text" id="Surname" class="first" placeholder="enter your surname"><br>

           <label for="Day">Date of Birth(Day) :</label>
        <input type="number" id="Day" class="first" placeholder="enter day"><br>

        <label for="Month">Month :</label>
        <input type="number" id="Month" class="first" placeholder="enter month"><br>

     

        <label for="Year">year :</label>
        <input type="number" id="Year" class="first" value="Year"><br>

        <input type="submit" id="Submit"  class="first" style="color: aqua; background-color: burlywood;">
        <h2 id="result" class="first">result is :</h2>
    </form>
    
</body>
<script src="script.js"></script>
</html>
